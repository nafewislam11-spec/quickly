services:
  - type: web
    name: quickly-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: quickly-postgres
          property: connectionString
      - key: BASE_URL
        value: https://quickly-app-95d0.onrender.com
      - key: QUICKLY_SECRET_KEY
        generateValue: true
      - key: QUICKLY_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: quickly-postgres
    databaseName: quickly
    user: quickly_user
    plan: free
